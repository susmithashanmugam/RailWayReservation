
# Application Configuration
spring.application.name=login-service
server.port=8082

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.railway.login=INFO
logging.file.name=logs/login-service.log

# Internal Service Communication
internal.auth.api-key=secretkey

# JWT Configuration
jwt.secret=railwaylocaldevsecretkey123456789012
jwt.expiration=3600000
jwt.issuer=railway-reservation-system
