
spring.application.name=payment-service
server.port=8085

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/railway_payment_db
spring.datasource.username=root
spring.datasource.password=Susmitha

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Service Discovery
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.railway.payment=INFO
logging.file.name=logs/payment-service.log

# JWT
jwt.secret=railwaylocaldevsecretkey123456789012
jwt.issuer=railway-reservation-system

internal.api-key=railway-internal-dev-key-change-before-deployment
